<title>News-Daily 브리핑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상황실 일일 정보보고서 — 본질(머리) → 피쉬본(8개 큰 뼈) → 분야 해설 → 가설 점검 → 국가별 선별 → 수집 현황 */
:root{
  --paper:#f3f4f6; --sheet:#ffffff; --ink:#151a24; --muted:#5b6475; --rule:#d7dbe3;
  --accent:#1f4fd1; --accent-soft:#e3eaff; --warn:#b45309; --warn-soft:#fdf0e1; --ok:#0f7a4f; --ok-soft:#e2f4ec;
  --spine:#151a24;
  --f-display:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --b-industry:#2563a8; --b-business:#7a4fb5; --b-stocks:#0f7a4f; --b-crypto:#c2620c;
  --b-monetary:#a0372f; --b-legislation:#4b5563; --b-forecast:#0e7490; --b-geopolitics:#9f1d5b;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1118; --sheet:#151a24; --ink:#e6e9ef; --muted:#9aa3b5; --rule:#2a3141;
  --accent:#7ea2ff; --accent-soft:#1d2a4d; --warn:#f0a35c; --warn-soft:#3a2a17; --ok:#4fc796; --ok-soft:#143327;
  --spine:#cfd5e1;
  --b-industry:#6ea3e6; --b-business:#b18ae6; --b-stocks:#4fc796; --b-crypto:#f0a35c;
  --b-monetary:#ef8077; --b-legislation:#aab3c2; --b-forecast:#4cc3d9; --b-geopolitics:#ec6fa6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1118; --sheet:#151a24; --ink:#e6e9ef; --muted:#9aa3b5; --rule:#2a3141;
  --accent:#7ea2ff; --accent-soft:#1d2a4d; --warn:#f0a35c; --warn-soft:#3a2a17; --ok:#4fc796; --ok-soft:#143327;
  --spine:#cfd5e1;
  --b-industry:#6ea3e6; --b-business:#b18ae6; --b-stocks:#4fc796; --b-crypto:#f0a35c;
  --b-monetary:#ef8077; --b-legislation:#aab3c2; --b-forecast:#4cc3d9; --b-geopolitics:#ec6fa6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
a{color:var(--accent);text-underline-offset:2px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:14px}
.masthead{display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.masthead .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.masthead h1{font-size:1.15rem;font-weight:800}
.class-tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;border:1px solid var(--ink);padding:1px 6px}
.essence{background:var(--sheet);border:1px solid var(--rule);padding:20px;display:flex;flex-direction:column;gap:12px}
.essence p.head{font-family:var(--f-display);font-size:1.45rem;font-weight:800;line-height:1.4;margin:0;text-wrap:balance}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.step{border-top:2px solid var(--accent);padding-top:8px;min-width:0}
.step b{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.step p{margin:2px 0 0;font-size:.92rem}
/* Fishbone */
.fish{background:var(--sheet);border:1px solid var(--rule);padding:18px 12px 0;overflow:hidden}
.fish-body{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.fish-body::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--spine)}
.bone{position:relative;padding:10px 0 14px;min-width:0}
.bone.l{grid-column:1;text-align:right;padding-right:14px}
.bone.r{grid-column:2;padding-left:14px}
.bone::after{content:"";position:absolute;top:22px;height:2px;width:22px;background:var(--bc)}
.bone.l::after{right:-14px}
.bone.r::after{left:-14px}
.bone .bname{display:inline-block;font-weight:700;font-size:.85rem;color:var(--bc);border-bottom:2px solid var(--bc);padding-bottom:1px}
.bone ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.bone li{font-size:.82rem;line-height:1.45;border-left:2px solid var(--bc);padding-left:7px;text-align:left}
.bone.l li{border-left:0;border-right:2px solid var(--bc);padding-left:0;padding-right:7px;text-align:right}
.bone li .cc{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);margin-left:4px}
.bone li .lk{font-family:var(--f-mono);font-size:.66rem;color:var(--accent);margin-left:3px}
.bone .none{font-size:.78rem;color:var(--muted)}
.fish-head{position:relative;margin:4px -12px 0;background:var(--ink);color:var(--sheet);padding:14px 18px 16px;text-align:center}
.fish-head::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-14px;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:12px solid var(--ink)}
.fish-head .eyebrow{color:inherit;opacity:.7}
.fish-head p{margin:4px 0 0;font-family:var(--f-display);font-weight:600;font-size:1rem}
.links{display:flex;flex-direction:column;gap:8px}
.link{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:.88rem}
.link .id{font-family:var(--f-mono);color:var(--accent);font-size:.78rem;padding-top:2px}
.link .path{font-weight:500}
/* Field analysis */
details.field{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--bc)}
details.field summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
details.field summary::-webkit-details-marker{display:none}
details.field summary .fname{font-weight:700;color:var(--bc)}
details.field summary .ess{font-size:.9rem;flex:1 1 240px;min-width:0}
details.field[open] summary{border-bottom:1px solid var(--rule)}
.fbody{padding:12px 14px 16px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:.9rem}
.kv>b{color:var(--muted);font-weight:500;font-size:.8rem;padding-top:2px}
.kv>div{min-width:0}
.counter{background:var(--warn-soft);padding:8px 10px;font-size:.88rem}
.counter b{color:var(--warn)}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.scen div{border:1px solid var(--rule);padding:8px 10px;font-size:.85rem;min-width:0}
.scen div b{display:block;font-size:.78rem}
.scen .sig{color:var(--muted);font-size:.78rem;margin-top:4px}
/* Hypothesis */
.hyp{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.hyp .col{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;min-width:0}
.hyp .col ul{margin:6px 0 0;padding-left:18px;font-size:.88rem}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:1px 8px;border-radius:999px}
.pill.sup{background:var(--ok-soft);color:var(--ok)} .pill.ag{background:var(--warn-soft);color:var(--warn)} .pill.nu{background:var(--accent-soft);color:var(--accent)}
.verdict{font-weight:700}
/* News list */
.news{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule)}
.imp{font-family:var(--f-mono);font-size:.8rem;font-weight:500;text-align:center;border:1px solid var(--ink);height:26px;line-height:24px}
.imp.i5{background:var(--ink);color:var(--sheet)}
.item h3{font-family:var(--f-body);font-weight:700;font-size:.97rem}
.item p{margin:4px 0;font-size:.88rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.78rem;color:var(--muted);align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{font:inherit;font-size:.82rem;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);padding:5px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.watch{margin:0;padding-left:20px}
.cov{overflow-x:auto}
.cov table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:420px}
.cov th,.cov td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.cov th{font-weight:500;color:var(--muted)}
.empty{background:var(--sheet);border:1px dashed var(--rule);padding:20px;color:var(--muted)}
footer{font-size:.78rem;color:var(--muted)}
@media (max-width:520px){.fish-body{column-gap:18px}.bone.l{padding-right:9px}.bone.r{padding-left:9px}.bone::after{width:14px}.bone.l::after{right:-9px}.bone.r::after{left:-9px}.kv{grid-template-columns:1fr;gap:2px}}
@media (prefers-reduced-motion:no-preference){details.field[open] .fbody{animation:fade .2s ease}}
@keyframes fade{from{opacity:.4}to{opacity:1}}

능성 시사(CBS·CNBC·NBC), 예측시장 민주 상원 74%(CNBC) — 의회 권력 이동이 대외 정책(이란·관세)을 바꿀 경우에 한해 가설과 관련"], "verdict": "약화", "note": "🔎 판정 '약화'(10-26 이후 8회 연속). 초안은 이란 축에서 '반박 우세'를 근거로 삼았으나 팀장 검토를 받아 고쳤다. ① 이란 축: 협상 신호(유가 급락 — 연합뉴스·WSJ·[관영] Xinhua, 이란 '이틀 안 재개방' — NYT·WELT, 카타르 대표단 테헤란 방문 — NYT·Ynet)와 무력 신호(AP '네타냐후 압박' — 11-02 Axios에 이어 두 번째 매체, 해협 유조선 피격 — 단일, 이란 '전면전 준비' — NYT, '돌파구 없음' — Interfax의 파르스 인용)가 맞선다. 트럼프는 선거 후 공습 재개를 부인했다(제목). 11-02와 마찬가지로 이 축은 판단을 보류한다. 단일 매체 제목(트럼프 '합의 원해', AP 압박, 공습 재개 부인)은 양쪽 모두 판정 근거에서 뺀다. ② 우크라이나 축: 자포리자 구호소 폭격(복수)은 지지 증거다. 올레시키 휴전은 대피용 국지 휴전이라 그 종료를 따로 세지 않는다(11-02 원칙). ③ 판정을 '약화'로 두는 근거는 AI·코인 축이다. 오늘 새로 러시아(데이터센터 용량 10% 국가 배정)와 독일(제3자로부터 독립을 내건 AI 동맹)이 연산력을 주권 자원으로 묶었다. 이는 '연산력 결제의 달러화' 전제에 대한 새 반례다. 앤트로픽 서류의 비용 구조(FT·Handelsblatt·Spiegel)도 같은 쪽이다. 반대로 오라클·앤트로픽의 미국 시장 자금 조달은 달러 자본 의존을 보여 일부 상쇄한다. 스테이블코인 근거는 오늘도 없다. 인텔·오픈AI는 기보도라 다시 세지 않는다."}, "top10": [{"headline_ko": "미 중간선거 당일: 트럼프 '매우 강력한 시도를 했다' — 패배 가능성 시사, 예측시장 민주당 상원 장악 74%", "importance": 5, "why": "트럼프는 리플렉팅 풀에서 한 선거 전날 연설에서 공화당이 '매우 강력한 시도를 했다'고 말했고(CBS·CNBC·NBC), NBC는 그가 대통령 소속 정당이 역사적으로 중간선거에서 이기지 못한다고 인정했다고 썼다. AP·WaPo·Reuters·Independent는 그가 마지막 날을 리플렉팅 풀 개보수 홍보로 보냈다고 전했다. 판세: 칼시 트레이더들은 민주당의 상원 장악 확률을 74%로 봤다(CNBC). JTBC는 '상원 7개 경합주 중 6곳 민주 우세'(제목), France 24는 민주당이 하원을 뒤집으려면 기존 의석을 모두 지키고 4석을 더 얻어야 하며 여론조사상 7개 핵심 주에서 앞서 있다고 썼다. FT 여론조사: 다수가 트럼프의 인플레이션 대응을 부정 평가. FT: 트럼프 2기 평균 연료비가 바이든 시기 수준을 넘었다. BBC: 선거운동 비용 120억 달러 가까이로 역대 최고 전망. 법적 다툼: 법무부가 캘리포니아 투표용지 소송을 대법원에 상고했고(ABC·Reuters·FT — FT는 '비시민권자 우편투표 배제 요청'), 트럼프는 민주당이 이기면 측근을 사면하겠다고 했다(WELT; YTN '선제 사면', 제목). 미시간: 스티븐스의 공화당 지지 뒤 엘사예드 캠프가 하루 240만 달러 모금을 보고했다(WaPo 제목; Independent '모금 기록 경신').", "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/live-updates/2026-elections-monday-november-2/"}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/11/02/trump-midterm-election-speech-reflecting-pool.html"}, {"name": "NBC News", "url": "https://www.nbcnews.com/politics/donald-trump/ahead-election-day-trump-sets-stage-potenti UUd3d0hDQnltY0x0U1dvOXB5RkhSRFZKVC13QmJFYnpCTVBZRnpvOUhLRVY4VklFeTlMT3hfRzZYR3NoWHNobjlUdUl3NExobno0SUVsZXc0?oc=5"}], "fields": ["legislation", "forecast"], "hypothesis": "무관"}, {"headline_ko": "이란: 협상 기대에 국제유가 급락(연합뉴스 '7%대·WTI 96달러선') — 이란 '합의되면 이틀 안에 해협 재개방'(복수 확인) vs 해협 유조선 피격(UKMTO)·AP '네타냐후 압박', 트럼프는 선거 후 공습 재개 부인", "importance": 5, "why": "유가: 2일(현지시간) 미·이란 평화 협상 가능성에 국제유가가 급락했다(WSJ 제목 2건 '유가 선물 급락'; [관영] Xinhua '큰 폭 하락'; 연합뉴스 '7% 넘게 급락·WTI 96달러선' — 수치는 연합뉴스 단일, 한국경제TV·중앙일보는 같은 속보 전재). 월요일 정규 거래일 기사다. 외교: 트럼프 '이란은 합의를 원해, 성사될 수도'(Ynet 제목). Ynet은 로이터를 인용해 카타르 중재단이 테헤란에서 아락치와 합의 초안을 논의할 예정이라고 전했고, NYT는 카타르 대표단이 월요일 테헤란에 도착해 외무장관과 회담을 이어갔다고 썼다(카타르 중재는 11-01부터 이어지는 과정). NYT: 이란 당국자들은 전면전을 준비하면서도 해협 재개방 협상에 진전이 있다며 합의 시 이틀 안에 재개방하겠다고 했다(11-01 테레비아사히 단일 보도가 오늘 복수 매체로 확인; WELT도 '미국이 요구 수용 시 이틀 내 개방, 선박은 이란 감독하 통항'). CBS: 이란은 '공은 미국에' 있다고 했다. 압박: AP는 관계자들을 인용해 네타냐후가 트럼프에게 중간선거 후 이란 공격을 압박한다고 보도했다(제목만 2건). Ynet·[관영] RIA는 이란 매체를 인용해 케슘섬 폭발음을 전했다(1차 출처 미확인). UKMTO는 오만 북쪽 호르무즈 해협에서 유조선이 출처 불명 탄약에 맞았다고 밝혔다(Interfax 인용, 단일). 이란 파르스는 메시지 교환이 아직 돌파구를 내지 못했다고 전했다(Interfax 인용). 트럼프는 선거 후 이란 공습 재개 계획을 부인했다(Vedomosti; [관영] RIA, 제목). 🔎 협상 신호와 무력 신호가 병존한다.", "sources": [{"name": "연합뉴스", "url": "https://www.yna.co.kr/view/AKR20261103007851072"}, {"name": "한국경제TV", "url": "https://news.google.com/rss/articles/CBMigAFBVV95cUxNcmlreEtPcTZvWWVOY1c3Y2JZbHRZNkwyVUlwMjFyR3Y5dk1lZ013U2szcFoyUW5jMXN5YVRXVzc0STdEY3F5S0loZzFrMmZFX245U2xUaUE0M2VVNE5lMkdueXZnSnZHamhZaXFFVy1MSWF2a1BZVldrekpRb0tkeg?oc=5"}, {"name": "중앙일보", "url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTFBCcklLRTY1YXp4T2tRY3ZhelQzZUcwblp3VU1sY2hUM3ZrLUxxUHBOSnFpMUV0UGFkb2lGRGtHUFFIeXBYaG1iX3p0V1hwbVM2Vk96NG53?oc=5"}, {"name": "Ynet News", "url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTFBQeEVCQklVUENrZ0hsVFhWbndVZ1ZjZmZSeUVZT3FUVlo1dG5fM0pzd0VJbG9sM21KSGVlMHlfMnJzQ2lQaU5OY1AtLVpFbFBmdGZHNg?oc=5"}, {"name": "Ynet News", "url": "https://news.google.com/rss/articles/CBMiVEFVX3lxTFBPdmJnVlVEdzRzWC0zV29LUHprVzA1dDhV <script>
(function(){
const D = JSON.parse(document.getElementById('briefing-data').textContent);
const FIELDS = [
  ["industry","산업"],["business","비즈니스"],["stocks","주식"],["crypto","코인"],
  ["monetary","각국 통화정책"],["legislation","신규·처리중 법안"],["forecast","미래 예측"],["geopolitics","국제 지정학"]];
const FNAME = Object.fromEntries(FIELDS);
const CC = {us:"미국",kr:"한국",jp:"일본",de:"독일",uk:"영국",fr:"프랑스",il:"이스라엘",ru:"러시아",cn:"중국"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bc = id => `--bc:var(--b-${id})`;
const srcLinks = arr => (arr||[]).map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)).join(" · ");
const hypPill = h => h==="지지" ? `<span class="pill sup">가설 지지</span>` : h==="반박" ? `<span class="pill ag">가설 반박</span>` : "";
const app = document.getElementById('app');
let html = "";

html += `<header class="masthead"><div class="row"><span class="eyebrow">News-Daily · 9개국 방송·신문 헤드라인 종합</span><span class="class-tag">DAILY BRIEF</span></div>
<div class="row"><h1>${esc(D.date)} 브리핑</h1><span class="mono" style="font-size:.78rem;color:var(--muted)">생성 ${esc(D.generated_at||"")}</span></div></header>`;

if (!D.essence) {
  html += `<div class="empty">아직 브리핑이 없습니다. 매일 아침 수집이 끝나면 이 자리에 오늘의 본질, 피쉬본 다이어그램, 분야별 해설이 채워집니다.</div>`;
  app.innerHTML = html; return;
}

// 1. 본질
const dv = D.essence.derivation || {};
html += `<section class="essence"><span class="eyebrow">오늘의 본질</span><p class="head">${esc(D.essence.headline)}</p>
<div class="steps">
 <div class="step"><b>① 가정 의심</b><p>${esc(dv.assumptions)}</p></div>
 <div class="step"><b>② 근본 요소로 분해</b><p>${esc(dv.decomposition)}</p></div>
 <div class="step"><b>③ 재조립</b><p>${esc(dv.rebuild)}</p></div>
</div></section>`;

// 2. 피쉬본
const fb = D.fishbone || {bones:[],links:[]};
const linkOf = {};
(fb.links||[]).forEach((l,i)=>{ const id="L"+(i+1); [l.from,l.to].forEach(x=>{(linkOf[x]=linkOf[x]||[]).push(id)}); l._id=id; });
const boneMap = Object.fromEntries((fb.bones||[]).map(b=>[b.field,b]));
let bones = "";
FIELDS.forEach(([id,name],i)=>{
  const b = boneMap[id] || {items:[]};
  const side = i%2===0 ? "l" : "r";
  const items = (b.items||[]).map(it=>`<li>${esc(it.label)}<span class="cc">${esc(CC[it.country]||it.country||"")}</span>${(linkOf[it.id]||[]).map(x=>`<span class="lk">${x}</span>`).join("")}</li>`).join("");
  bones += `<div class="bone ${side}" style="${bc(id)};grid-row:${Math.floor(i/2)+1}"><span class="bname">${name}</span>${items?`<ul>${items}</ul>`:`<div class="none">오늘 해당 뉴스 없음</div>`}</div>`;
});
html += `<section><div><span class="eyebrow">피쉬본 다이어그램</span><h2>조각 뉴스의 연결 구조</h2></div>
<div class="fish" role="img" aria-label="8개 분야를 큰 뼈로, 오늘의 본질을 머리로 한 피쉬본 다이어그램"><div class="fish-body">${bones}</div>
<div class="fish-head"><span class="eyebrow">머리 · 결과</span><p>${esc(fb.head || D.essence.headline)}</p></div></div>
${(fb.links||[]).length?`<div class="links">${fb.links.map(l=>`<div class="link"><span class="id">${l._id}</span><div><div class="path">${esc(l.from_label||l.from)} → ${esc(l.to_label||l.to)}</div><div>${esc(l.logic)}</div></div></div>`).join("")}</div>`:""}
</section>`;

// 3. 분야별 해설
const fa = D.fields || [];
if (fa.length){
  html += `<section><div><span class="eyebrow">분야별 해설</span><h2>현상 → 유사 사례 → 원인 → 본질 → 반론 → 시나리오</h2></div>`;
  FIELDS.forEach(([id,name])=>{
    const f = fa.find(x=>x.id===id); if(!f) return;
    html += `<details class="field" style="${bc(id)}"><summary><span class="fname">${name}</span><span class="ess">${esc(f.essence)}</span></summary><div class="fbody">
<div class="kv"><b>현상</b><div>${esc(f.phenomenon)}</div></div>
<div class="kv"><b>유사 사례</b><div>${esc(f.precedent)}</div></div>
<div class="kv"><b>원인·논리</b><div>${esc(f.cause)}</div></div>
<div class="counter"><b>반론 · 이 해석이 틀렸다면</b><br>${esc(f.counter)}</div>
<div class="scen">${(f.scenarios||[]).map(s=>`<div><b>${esc(s.name)}</b>${esc(s.desc)}<div class="sig">확인 신호: ${esc(s.signal)}</div></div>`).join("")}</div>
</div></details>`;
  });
  html += `</section>`;
}

// 4. 가설 점검
const hc = D.hypothesis_check;
if (hc){
  html += `<section><div><span class="eyebrow">작업 가설 점검 · 달러 패권 체제 전환</span><h2>판정: <span class="verdict">${esc(hc.verdict)}</span></h2></div>
<div class="hyp"><div class="col"><span class="pill sup">지지 증거</span><ul>${(hc.support||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
<div class="col"><span class="pill ag">반박 증거 · 균열</span><ul>${(hc.against||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>
${hc.note?`<p style="margin:0;font-size:.88rem">${esc(hc.note)}</p>`:""}</section>`;
}

// 5. 중요 뉴스
const top = D.top10 || [], byc = D.by_country || {};
const item = n => `<div class="item"><div class="imp ${n.importance>=5?"i5":""}">${esc(n.importance)}</div><div style="min-width:0"><h3>${esc(n.headline_ko)}</h3><p>${esc(n.why)}</p>
<div class="meta">${(n.fields||[]).map(f=>`<span style="color:var(--b-${esc(f)})">#${esc(FNAME[f]||f)}</span>`).join("")}${hypPill(n.hypothesis)}<span>출처: ${srcLinks(n.sources)}</span></div></div></div>`;
const tabs = [["top","TOP 10"]].concat(Object.keys(CC).filter(k=>(byc[k]||[]).length).map(k=>[k,CC[k]]));
html += `<section><div><span class="eyebrow">팀장 선별 · 중요도 1–5</span><h2>중요 뉴스와 선정 이유</h2></div>
<div class="tabs" role="tablist">${tabs.map(([k,n],i)=>`<button role="tab" id="tab-${k}" data-k="${k}" aria-selected="${i===0}">${n}</button>`).join("")}</div>
<div class="news" id="newslist">${top.map(item).join("")}</div></section>`;

// 6. 내일 지켜볼 신호
if ((D.watch||[]).length) html += `<section><div><span class="eyebrow">관찰 신호</span><h2>내일 지켜볼 것</h2></div><ol class="watch">${D.watch.map(w=>`<li>${esc(w)}</li>`).join("")}</ol></section>`;

// 7. 수집 현황
const cov = D.coverage || {};
if (Object.keys(cov).length) html += `<section><div><span class="eyebrow">팀원 수집 현황</span></div><div class="cov"><table><thead><tr><th>팀</th><th>수집</th><th>접근 실패 방송사</th></tr></thead><tbody>
${Object.keys(CC).filter(k=>cov[k]).map(k=>`<tr><td>${CC[k]}팀</td><td class="mono">${cov[k].headlines}건</td><td>${esc((cov[k].unavailable||[]).join(", ")||"—")}</td></tr>`).join("")}</tbody></table></div></section>`;

html += `<footer>국영·관영 매체 보도는 해당 정부의 메시지로 분류해 읽었습니다. 작업 가설은 전제가 아니라 매일 검증하는 대상입니다.</footer>`;
app.innerHTML = html;

const list = document.getElementById('newslist');
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected', x===b));
  const k=b.dataset.k; list.innerHTML = (k==="top"?top:(byc[k]||[])).map(item).join("");
}));
})();
</script>
