name: 헤드라인 수집

on:
  schedule:
    # 매일 05:20 KST (20:20 UTC 전날) — Claude 분석(06:4x KST) 전에 수집 완료
    - cron: "20 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "config/sources.json", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 실행
        run: python collector/collect.py
      - name: 커밋
        run: |
          git config user.name "news-daily-bot"
          git config user.email "news-daily-bot@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "raw: $(TZ=Asia/Seoul date +%F) 헤드라인 수집"
            git pull --rebase origin main
            git push
          fi
