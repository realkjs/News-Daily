name: 헤드라인 수집

on:
  schedule:
    # 매일 04:47 KST (19:47 UTC 전날) — GitHub 예약 지연을 감안해 Claude 분석(06:12 KST)보다 넉넉히 앞서 수집
    - cron: "47 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 실행
        run: python collector/collect.py
      - name: 커밋
        run: |
          git config user.name "news-daily-bot"
          git config user.email "news-daily-bot@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "raw: $(TZ=Asia/Seoul date +%F) 헤드라인 수집"
            git pull --rebase origin main
            git push
          fi
